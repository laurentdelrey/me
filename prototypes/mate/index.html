<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- ARTIFACT-START -->
<title>Mate Control Room</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=Chakra+Petch:wght@400;600&display=swap">
<style>
/* Layout: a WebGL wheelhouse fills the viewport; a CSS3D CRT lives inside it; a thin HUD sits on top. */
:root {
  --bg: #050912;          /* night outside */
  --fg: #d9dde7;          /* HUD text */
  --hud-dim: #7c8597;
  --brass: #d6a85a;       /* HUD accent, lamp warm */
  --phos: #7cf29a;        /* CRT phosphor */
  --phos-dim: #2f7a47;
  --phos-bg: #04110a;
  --warn: #f2c35b;
  --bad: #ff6b5e;
  --font-crt: 'VT323', 'Courier New', monospace;
  --font-hud: 'Chakra Petch', 'Segoe UI', system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-hud); overflow: hidden; }
#gl, #css { position: fixed; inset: 0; width: 100%; height: 100%; }
#gl { z-index: 0; cursor: grab; touch-action: none; }
#gl.dragging { cursor: grabbing; }
#css { z-index: 1; pointer-events: none; }
#css > div { pointer-events: none !important; }

/* ---------- CRT screen (lives in 3D) ---------- */
#screen {
  width: 560px; height: 420px; box-sizing: border-box;
  background: var(--phos-bg); color: var(--phos);
  font-family: var(--font-crt); font-size: 17px; line-height: 1.15;
  border-radius: 14px; overflow: hidden; position: relative;
  padding: 14px 18px 12px; display: grid; grid-template-rows: auto 1fr auto; gap: 8px;
  box-shadow: inset 0 0 60px rgba(0,0,0,.75), inset 0 0 6px rgba(124,242,154,.25);
  pointer-events: none;
  user-select: none;
}
body.docked #screen { pointer-events: auto; user-select: text; }
#screen::before { /* scanlines */
  content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 5;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 1px, transparent 1px 3px);
  mix-blend-mode: multiply;
}
#screen::after { /* vignette + glass */
  content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 6;
  background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%);
}
@media (prefers-reduced-motion: no-preference) {
  #screen { animation: flick 4s infinite steps(1); }
  @keyframes flick { 0%,94%,100% { filter: brightness(1); } 95% { filter: brightness(1.06); } 97% { filter: brightness(.97); } }
}
.scr-head { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px dashed var(--phos-dim); padding-bottom: 6px; }
.scr-head b { font-weight: 400; letter-spacing: .08em; }
.scr-head .clock { color: var(--phos-dim); }
.scr-head .attn { color: var(--warn); display: none; }
body.awaiting .scr-head .attn { display: inline; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.scr-body { display: grid; grid-template-columns: 1.05fr 1fr; gap: 14px; min-height: 0; }
.scr-col { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
.lbl { color: var(--phos-dim); letter-spacing: .12em; font-size: 15px; }

.stages { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.stage { border: 1px solid var(--phos-dim); padding: 3px 5px; font-size: 15px; letter-spacing: .04em; color: var(--phos-dim); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stage.done { color: var(--phos); border-color: var(--phos); }
.stage.active { background: var(--phos); color: var(--phos-bg); border-color: var(--phos); }
.stage.done::before { content: "✓ "; }

.gates { display: flex; flex-direction: column; gap: 3px; }
.gate { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px; align-items: baseline; }
.gate > span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gate .bar { grid-column: 1 / -1; height: 6px; background: rgba(124,242,154,.12); position: relative; }
.gate .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--phos); width: 0; transition: width .4s linear; }
.gate.warn .bar i, .gate.warn .val { background: var(--warn); color: var(--warn); }
.gate.warn .val { background: none; }
.gate.bad .bar i { background: var(--bad); } .gate.bad .val { color: var(--bad); }
.gate .val { font-variant-numeric: tabular-nums; }

.prog { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; }
.prog .track { height: 10px; border: 1px solid var(--phos-dim); position: relative; }
.prog .track i { position: absolute; inset: 1px; right: auto; background: var(--phos); width: 0; transition: width .3s linear; }
.prog .pct { font-variant-numeric: tabular-nums; min-width: 4ch; text-align: right; }

.log { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; font-size: 15px; color: var(--phos-dim); }
.log div { flex: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.log div.hot { color: var(--phos); }
.log div.bad { color: var(--bad); }

.chat { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; scrollbar-width: none; }
.chat::-webkit-scrollbar { display: none; }
.msg { max-width: 95%; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.mate::before { content: "MATE ▸ "; color: var(--phos-dim); }
.msg.you { align-self: flex-end; text-align: right; color: #c4f7d1; }
.msg.you::before { content: "YOU ▸ "; color: var(--phos-dim); }
.msg.sys { color: var(--phos-dim); font-size: 15px; }
.ask { color: var(--warn); font-size: 15px; letter-spacing: .06em; min-height: 17px; }
.ask span { display: inline-block; border: 1px solid var(--warn); padding: 0 5px; margin-right: 4px; animation: blink 1.2s steps(1) infinite; }
@media (prefers-reduced-motion: reduce) { .ask span, .scr-head .attn { animation: none; } }

.input { display: flex; gap: 6px; align-items: center; border-top: 1px dashed var(--phos-dim); padding-top: 6px; }
.input label { color: var(--phos); }
.input input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--phos); font: inherit; caret-color: var(--phos); padding: 0; }
.input input::placeholder { color: var(--phos-dim); }
.input input:focus { box-shadow: 0 1px 0 var(--phos); }

/* ---------- HUD (screen-space) ---------- */
#hud { position: fixed; inset: 0; z-index: 2; pointer-events: none; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; justify-content: space-between; }
.hud-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.wordmark { font-weight: 600; letter-spacing: .3em; font-size: 14px; color: var(--brass); }
.wordmark small { display: block; letter-spacing: .14em; font-size: 10px; color: var(--hud-dim); margin-top: 3px; font-weight: 400; }
.chip { font-size: 12px; letter-spacing: .14em; color: var(--warn); border: 1px solid var(--warn); padding: 6px 10px; opacity: 0; transition: opacity .3s; background: rgba(5,9,18,.55); }
body.awaiting:not(.docked) .chip { opacity: 1; animation: blink 1.4s steps(1) infinite; }
.hud-bottom { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.hint { font-size: 12px; letter-spacing: .08em; color: var(--hud-dim); max-width: 60ch; }
.hint kbd { font: inherit; color: var(--fg); border: 1px solid var(--hud-dim); padding: 0 5px; border-radius: 3px; }
.hud-btn { pointer-events: auto; font: 600 12px/1 var(--font-hud); letter-spacing: .18em; color: var(--bg); background: var(--brass); border: 0; padding: 12px 16px; cursor: pointer; border-radius: 2px; }
.hud-btn:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
#loading { position: fixed; inset: 0; z-index: 9; display: grid; place-items: center; background: var(--bg); color: var(--hud-dim); letter-spacing: .3em; font-size: 12px; transition: opacity .6s; }
#loading.gone { opacity: 0; pointer-events: none; }
@media (max-width: 600px) { .hint { display: none; } }
</style>
</head>
<body>
<div id="loading">CASTING OFF</div>
<canvas id="gl"></canvas>
<div id="css"></div>

<!-- The CRT content. It is moved into the 3D scene by CSS3DRenderer. -->
<div id="screen" aria-label="Mate console">
  <div class="scr-head">
    <b>MATE // PROJECT HARBOR</b>
    <span class="attn">◆ INPUT REQUESTED</span>
    <span class="clock" id="clock">00:00:00</span>
  </div>
  <div class="scr-body">
    <div class="scr-col">
      <div class="lbl">VOYAGE</div>
      <div class="stages" id="stages"></div>
      <div class="prog"><span class="lbl" id="progLabel">IDLE</span><div class="track"><i id="progBar"></i></div><span class="pct" id="progPct">0%</span></div>
      <div class="lbl">GATES</div>
      <div class="gates" id="gates"></div>
      <div class="lbl" style="margin-top:4px">LOG</div>
      <div class="log" id="log"></div>
    </div>
    <div class="scr-col">
      <div class="lbl">MATE</div>
      <div class="chat" id="chat"></div>
      <div class="ask" id="ask"></div>
      <form class="input" id="form" autocomplete="off">
        <label for="say">&gt;</label>
        <input id="say" type="text" placeholder="talk to your mate" spellcheck="false">
      </form>
    </div>
  </div>
</div>

<div id="hud">
  <div class="hud-top">
    <div class="wordmark">MATE<small>WHEELHOUSE · M/V HARBOR</small></div>
    <div class="chip">MATE NEEDS YOU ▼</div>
  </div>
  <div class="hud-bottom">
    <div class="hint" id="hint">Drag to look around · Click the console or press <kbd>Space</kbd> to sit down</div>
    <button class="hud-btn" id="toggle" type="button">SIT DOWN</button>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { CSS3DRenderer, CSS3DObject } from 'three/addons/renderers/CSS3DRenderer.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* =====================================================================
   1. THE PANEL — every action the mate can ever ask for, always present.
   ===================================================================== */
const BUTTONS = [
  { id: 'YES',      color: 0x7cf29a, side: 'L' },
  { id: 'NO',       color: 0xff6b5e, side: 'L' },
  { id: 'ACCEPT',   color: 0x7cf29a, side: 'L' },
  { id: 'DECLINE',  color: 0xff6b5e, side: 'L' },
  { id: 'LATER',    color: 0xf2c35b, side: 'L' },
  { id: 'APPROVE',  color: 0x7cf29a, side: 'R' },
  { id: 'HOLD',     color: 0xf2c35b, side: 'R' },
  { id: 'SKIP',     color: 0x8fb3ff, side: 'R' },
  { id: 'ROLLBACK', color: 0xff6b5e, side: 'R' },
  { id: 'SHIP',     color: 0xd8f7ff, side: 'R' },
];
const SYN = {
  YES: ['yes','yep','yeah','ok','okay','sure','go','do it','aye'],
  NO: ['no','nope','nah','negative'],
  ACCEPT: ['accept','agreed','fine','sounds good','yes','ok','aye'],
  DECLINE: ['decline','reject','no','nope'],
  APPROVE: ['approve','approved','sign','signed','yes','ok','go','aye'],
  HOLD: ['hold','wait','pause','not yet','stay'],
  SKIP: ['skip','ignore','move on','proceed anyway'],
  LATER: ['later','tomorrow','remind','snooze','not now'],
  ROLLBACK: ['rollback','roll back','revert','kill','disable'],
  SHIP: ['ship','launch','send it','go live','yes','go','aye'],
};

/* =====================================================================
   2. STATE + CRT RENDERING
   ===================================================================== */
const $ = (id) => document.getElementById(id);
const S = {
  stages: ['TEST', 'DOGFOOD', 'BETA', 'LAUNCH'],
  stage: -1, done: [false, false, false, false],
  gates: [], prog: { label: 'IDLE', pct: 0 },
  awaiting: null, docked: false,
};
const lit = new Set();            // ids of buttons currently requesting input
const listeners = { lit: [], press: [] };

function renderStages() {
  $('stages').innerHTML = S.stages.map((n, i) =>
    `<div class="stage ${S.done[i] ? 'done' : i === S.stage ? 'active' : ''}">${n}</div>`).join('');
}
function gateOk(g) { return g.dir === '>=' ? g.val >= g.target : g.val <= g.target; }
function renderGates() {
  $('gates').innerHTML = S.gates.map(g => {
    const ok = gateOk(g);
    let ratio = g.dir === '>=' ? g.val / g.target : g.target / Math.max(g.val, 1e-6);
    if (g.target === 0) ratio = ok ? 1 : 0;
    const cls = ok ? '' : ratio > 0.9 ? 'warn' : 'bad';
    const val = g.fmt ? g.fmt(g.val) : g.val.toFixed(g.dec ?? 0) + g.unit;
    const tgt = `${g.dir} ${g.fmt ? g.fmt(g.target) : g.target + g.unit}`;
    return `<div class="gate ${cls}"><span>${g.name} <span class="lbl">${tgt}</span></span><span class="val">${val}</span><div class="bar"><i style="width:${Math.min(100, ratio * 100).toFixed(1)}%"></i></div></div>`;
  }).join('');
}
function setProg(label, pct) {
  S.prog = { label, pct };
  $('progLabel').textContent = label; $('progPct').textContent = Math.round(pct) + '%';
  $('progBar').style.width = pct + '%';
}
function log(text, cls = '') {
  const el = document.createElement('div'); el.textContent = `${clockStr()} ${text}`; el.className = cls;
  const L = $('log'); L.appendChild(el); while (L.children.length > 5) L.removeChild(L.firstChild);
}
function clockStr() { return new Date().toISOString().slice(11, 19); }
setInterval(() => { $('clock').textContent = clockStr() + ' UTC'; }, 1000);

const chat = $('chat');
function addMsg(cls, text) {
  const el = document.createElement('div'); el.className = 'msg ' + cls; el.textContent = text;
  chat.appendChild(el); chat.scrollTop = chat.scrollHeight; return el;
}
const wait = (ms) => new Promise(r => setTimeout(r, ms));
async function say(text) {
  const el = addMsg('mate', '');
  const step = Math.max(8, Math.min(22, 1600 / text.length));
  for (let i = 1; i <= text.length; i++) { el.textContent = text.slice(0, i); chat.scrollTop = chat.scrollHeight; await wait(step); }
  await wait(350);
}
function you(text) { addMsg('you', text); }
function sys(text) { addMsg('sys', text); }

function setLit(ids) {
  lit.clear(); ids.forEach(i => lit.add(i));
  $('ask').innerHTML = ids.length ? 'AWAITING ▸ ' + ids.map(i => `<span>${i}</span>`).join('') : '';
  document.body.classList.toggle('awaiting', ids.length > 0);
  listeners.lit.forEach(f => f(lit));
}
function ask(ids) {
  return new Promise(resolve => { S.awaiting = { ids, resolve }; setLit(ids); });
}
/** Press a physical button. Returns true if the mate was waiting for it. */
function press(id) {
  listeners.press.forEach(f => f(id));
  if (!S.awaiting || !S.awaiting.ids.includes(id)) { return false; }
  const { resolve } = S.awaiting; S.awaiting = null; setLit([]);
  you(id); resolve(id); return true;
}

/* Free text goes to the mate; if it reads like one of the lit buttons, it presses it. */
$('form').addEventListener('submit', (e) => {
  e.preventDefault();
  const raw = $('say').value.trim(); if (!raw) return; $('say').value = '';
  const t = raw.toLowerCase();
  if (S.awaiting) {
    const hit = S.awaiting.ids.find(id => SYN[id].some(w => new RegExp(`(^|\\b)${w.replace(/'/g, "'?")}(\\b|$)`).test(t)));
    if (hit) { you(raw); const { resolve } = S.awaiting; S.awaiting = null; setLit([]); resolve(hit); return; }
  }
  you(raw);
  if (/status|where are we|progress/.test(t)) {
    say(`We're in ${S.stage < 0 ? 'the harbour, not started' : S.stages[S.stage]}. ${S.prog.label} at ${Math.round(S.prog.pct)}%. ${S.gates.filter(gateOk).length}/${S.gates.length} gates green.`);
  } else if (/gate|metric/.test(t)) {
    say(S.gates.length ? S.gates.map(g => `${g.name}: ${gateOk(g) ? 'green' : 'not yet'}`).join('. ') + '.' : 'No gates set for this leg yet.');
  } else if (/help|what can/.test(t)) {
    say('I set up cohorts, write gatekeepers, watch the gauges and ask you only when a call is yours to make. The lit buttons are the answers I need right now.');
  } else if (/thank/.test(t)) {
    say("Any time, skipper.");
  } else if (S.awaiting) {
    say(`Noted. I still need one of: ${S.awaiting.ids.join(' / ')}.`);
  } else {
    say("Noted. I'm on it, nothing needed from you right now.");
  }
});

/* A timed simulation leg: ramps the progress bar and lets gates drift. */
function runSim({ label, dur, tick, events = [] }) {
  return new Promise(resolve => {
    const t0 = performance.now(); let fired = new Set();
    const h = setInterval(() => {
      const p = Math.min(1, (performance.now() - t0) / dur);
      setProg(label, p * 100); tick?.(p); renderGates();
      events.forEach(([at, text, cls], i) => { if (p >= at && !fired.has(i)) { fired.add(i); log(text, cls); } });
      if (p >= 1) { clearInterval(h); resolve(); }
    }, 120);
  });
}
const jit = (a) => (Math.random() - 0.5) * a;
const lerp = (a, b, t) => a + (b - a) * t;
function startStage(i, gates) { S.stage = i; S.gates = gates; renderStages(); renderGates(); }
function finishStage(i) { S.done[i] = true; renderStages(); }

/* =====================================================================
   3. THE VOYAGE — a scripted project, from first test to launch.
   ===================================================================== */
async function voyage() {
  renderStages(); setProg('IDLE', 0);
  await wait(900);
  await say("Evening, skipper. Harbor is built and tied up at the dock.");
  await say("First leg is internal testing. Want me to set up the cohort (12 engineers from Platform) and arm the kill switch?");
  let a = await ask(['YES', 'NO', 'LATER']);
  while (a !== 'YES') {
    if (a === 'NO') { await say("Understood. Engines stay warm. Say YES whenever you're ready."); a = await ask(['YES', 'LATER']); }
    else { await say("I'll nudge you in a moment."); await wait(7000); await say("Still at the dock. Set up the cohort and the kill switch?"); a = await ask(['YES', 'NO', 'LATER']); }
  }
  log('Cohort invited: 12 engineers (Platform)', 'hot'); log('Kill switch armed on flag harbor_v1');
  await say("Cohort invited, kill switch armed on harbor_v1. Now the gatekeepers for this leg.");
  const gTest = [
    { name: 'Crash-free', val: 0, unit: '%', target: 99.5, dir: '>=', dec: 1 },
    { name: 'p95 latency', val: 0, unit: 'ms', target: 400, dir: '<=' },
    { name: 'P0 bugs', val: 0, unit: '', target: 0, dir: '<=' },
  ];
  startStage(0, gTest);
  await say("I propose: crash-free sessions ≥ 99.5%, p95 latency ≤ 400ms, zero P0s. Accept?");
  a = await ask(['ACCEPT', 'DECLINE', 'SKIP']);
  if (a === 'DECLINE') {
    await say("Fair. I'll loosen latency to 450ms and keep the rest. Accept, or skip gates for this leg?");
    gTest[1].target = 450; renderGates();
    a = await ask(['ACCEPT', 'SKIP']);
  }
  if (a === 'SKIP') { S.gates = []; renderGates(); log('No gates on this leg. Your call.', 'bad'); await say("No gates it is. I'll still watch the gauges and tell you what I see."); }
  else { log('Gates accepted for TESTING', 'hot'); await say("Gates locked. Pushing build 412 to the cohort now."); }

  await runSim({ label: 'TESTING', dur: 14000,
    tick: (p) => { if (!S.gates.length) return; S.gates[0].val = lerp(97.2, 99.72, Math.sqrt(p)) + jit(0.08); S.gates[1].val = lerp(540, 430, p) + jit(14); },
    events: [[0.04, 'Build 412 pushed to cohort'], [0.2, '9/12 installed, first sessions in'], [0.45, 'Crash-free climbing past 99%'], [0.62, 'Kill switch drill: disabled in 1.2s, re-enabled', 'hot'], [0.85, 'p95 latency hovering above gate'], [1, 'Internal testing complete', 'hot']] });
  if (S.gates.length) { S.gates[1].val = 430; renderGates(); }
  finishStage(0);
  if (S.gates.length) {
    await say("Internal testing done. Two gates green, latency is amber at 430ms against a 400 gate. Push to dogfooding anyway?");
    a = await ask(['YES', 'NO', 'HOLD']);
    while (a !== 'YES') {
      if (a === 'NO') {
        await say("Then I'll hold here. Filed PERF-218 with Platform for the latency and pinged them.");
        log('PERF-218 filed: p95 regression in board sync');
        await runSim({ label: 'WAITING ON PERF-218', dur: 7000, tick: (p) => { S.gates[1].val = lerp(430, 362, p * p) + jit(6); }, events: [[0.5, 'PERF-218: fix in review'], [1, 'PERF-218 landed, p95 362ms', 'hot']] });
        await say("PERF-218 landed. p95 is 362ms, all three gates green. Go to dogfooding?");
        a = await ask(['YES', 'HOLD']);
      } else { await say("Holding. Calm seas, no rush."); await wait(8000); await say("Still holding at the end of testing. Ready to move to dogfooding?"); a = await ask(['YES', 'NO', 'HOLD']); }
    }
  } else { await say("Testing leg done with no gates. I'd rather we had them for dogfooding. Moving on."); }

  /* ---- DOGFOOD ---- */
  const gDog = [
    { name: 'Crash-free', val: 99.7, unit: '%', target: 99.5, dir: '>=', dec: 1 },
    { name: 'Adoption', val: 0, unit: '%', target: 30, dir: '>=' },
    { name: 'P1 bugs', val: 0, unit: '', target: 0, dir: '<=' },
  ];
  startStage(1, gDog);
  await say("Dogfooding: rolling harbor_v1 to all 640 employees over the next few hours. Gates are crash-free ≥ 99.5%, weekly adoption ≥ 30%, no open P1s.");
  log('Rollout to employees started', 'hot');
  await runSim({ label: 'ROLLOUT 0→60%', dur: 8000,
    tick: (p) => { gDog[0].val = 99.7 + jit(0.1); gDog[1].val = lerp(0, 22, p) + jit(0.6); },
    events: [[0.15, '25% of employees enabled'], [0.5, 'Design team onboarded (41 people)'], [0.9, 'P1 reported: boards vanish after rename', 'bad'], [1, '4 reports from design, growing', 'bad']] });

  boat.rotation.z = Math.sin(t * 0.45) * 0.014 * sway; boat.rotation.x = Math.sin(t * 0.31 + 1) * 0.007 * sway; boat.position.y = Math.sin(t * 0.5) * 0.03 * sway;
  // sea
  const p = seaGeo.attributes.position.array;
  for (let i = 0; i < p.length; i += 3) { const x = seaBase[i], z = seaBase[i + 2]; p[i + 1] = Math.sin(x * 0.18 + t * 0.9) * 0.5 + Math.sin(z * 0.14 - t * 0.7) * 0.4 + Math.sin((x + z) * 0.07 + t * 0.4) * 0.6; }
  seaGeo.attributes.position.needsUpdate = true; seaGeo.computeVertexNormals();
  beacon.material.color.setHex((t % 4) < 0.25 ? 0xfff2c0 : 0x3a2d14);
  // camera: ease between standing POV and the docked pose
  const target = S.docked ? DOCK : STAND; const k = 1 - Math.pow(0.001, rawDt);
  view.pos.lerp(target.pos, k);
  const ty = S.docked ? DOCK.yaw + dockLook.yaw : look.yaw, tp = S.docked ? DOCK.pitch + dockLook.pitch : look.pitch, tf = S.docked ? dockFov(camera.aspect) : STAND.fov;
  view.yaw += (ty - view.yaw) * k; view.pitch += (tp - view.pitch) * k; view.fov += (tf - view.fov) * k;
  camera.position.copy(view.pos); camera.rotation.set(view.pitch, -view.yaw, 0, 'YXZ');
  if (Math.abs(camera.fov - view.fov) > 0.01) { camera.fov = view.fov; camera.updateProjectionMatrix(); }
  // buttons: lit ones breathe, pressed ones dip
  const pulse = 0.5 + 0.5 * Math.sin(t * 5);
  for (const m of buttonMeshes) {
    const u = m.userData; const on = lit.has(u.id);
    u.face.emissiveIntensity += (((on ? 1.4 + pulse * 1.2 : 0.08)) - u.face.emissiveIntensity) * Math.min(1, dt * 10);
    u.pressT = Math.max(0, u.pressT - dt * 4); m.position.z = u.restZ - Math.sin(u.pressT * Math.PI) * 0.012;
  }
  screenGlow.material.color.setHex(lit.size ? 0x17522c : 0x0f3d20);
  drawRadar(dt);
  composer.render(); cssRenderer.render(scene, camera);
}
document.fonts?.ready.then(() => { buttonMeshes.forEach(m => { const t = labelTexture(m.userData.id, m.userData.color); m.userData.face.map = t; m.userData.face.emissiveMap = t; m.userData.face.needsUpdate = true; }); });
window.__mate = { camera, view, S, press, setDocked, dockFov };
frame();
$('loading').classList.add('gone');
voyage();
</script>
